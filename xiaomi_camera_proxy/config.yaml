name: Xiaomi MIoT Camera Proxy
version: "0.4.19"
slug: xiaomi_camera_proxy
description: Camera streaming proxy for Xiaomi MIoT cameras (WebRTC streaming via miot_kit)
url: https://github.com/Ricky-Hao/ha-xiaomi-miot-camera
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
host_network: true
ports:
  8765/tcp: 8765
  8889/tcp: 8889
ports_description:
  8765/tcp: HTTP/WebSocket API
  8889/tcp: WebRTC streaming
map:
  - config:rw
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
