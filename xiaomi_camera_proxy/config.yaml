name: Xiaomi MIoT Camera Proxy
version: "0.6.8"
slug: xiaomi_camera_proxy
description: Camera streaming proxy for Xiaomi MIoT cameras with direct WebRTC output
url: https://github.com/Ricky-Hao/ha-xiaomi-miot-camera
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
host_network: true
ports:
  8765/tcp: 8765
  8889/tcp: 8889
ports_description:
  8765/tcp: HTTP API
  8889/tcp: WebRTC (WHEP)
map:
  - config:rw
options:
  log_level: info
  transcode_h264: true
schema:
  log_level: list(debug|info|warning|error)
  transcode_h264: bool?
