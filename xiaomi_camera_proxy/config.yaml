name: Xiaomi MIoT Camera Proxy
version: "0.5.4"
slug: xiaomi_camera_proxy
description: Camera streaming proxy for Xiaomi MIoT cameras (RTSP output for HA go2rtc)
url: https://github.com/Ricky-Hao/ha-xiaomi-miot-camera
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
host_network: true
ports:
  8765/tcp: 8765
  8554/tcp: 8554
ports_description:
  8765/tcp: HTTP API
  8554/tcp: RTSP streaming
map:
  - config:rw
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
