# MediaMTX configuration for Xiaomi Camera Proxy
# Lightweight RTSP server - WebRTC is handled by HA go2rtc

###############################################
# Global settings

logLevel: info
logDestinations: [stdout]

# Timeouts
readTimeout: 10s
writeTimeout: 10s

###############################################
# RTSP server - exposed to HA go2rtc

rtsp: yes
protocols: [tcp]
rtspAddress: :8554

###############################################
# WebRTC - DISABLED (use HA go2rtc instead)

webrtc: no

###############################################
# HLS - DISABLED

hls: no

###############################################
# API - DISABLED (not needed)

api: no

###############################################
# Path defaults

pathDefaults:
  # Source is FFmpeg publisher (not on-demand pull)
  source: publisher
  
  # Allow publisher to reconnect/overwrite
  overridePublisher: yes
  
  # Recording (disabled)
  record: no

###############################################
# Paths
# Camera streams published to /camera/{did}/{channel}
# RTSP: rtsp://localhost:8554/camera/{did}/{channel}
# Use HA go2rtc to convert to WebRTC

paths:
  ~^camera/(.+)/(\d+)$:
    source: publisher
    overridePublisher: yes
