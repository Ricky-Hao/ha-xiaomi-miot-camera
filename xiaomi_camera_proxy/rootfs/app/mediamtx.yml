# MediaMTX configuration for Xiaomi Camera Proxy
# This RTSP server receives H.264/H.265 streams from cameras via FFmpeg publisher

###############################################
# Global settings

logLevel: info
logDestinations: [stdout]

# Timeouts
readTimeout: 10s
writeTimeout: 10s

###############################################
# RTSP server

rtsp: yes
protocols: [tcp]
rtspAddress: :8554

###############################################
# WebRTC server - Low latency streaming

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: '*'
webrtcICEServers2: []

###############################################
# HLS server - Always-on for instant playback

hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes  # Keep HLS segments ready even without viewers
hlsVariant: lowLatency  # Low latency HLS (LL-HLS)
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsAllowOrigin: '*'

###############################################
# API

api: yes
apiAddress: :9997

###############################################
# Path defaults

pathDefaults:
  # Source is FFmpeg publisher (not on-demand pull)
  source: publisher
  
  # Allow publisher to reconnect/overwrite
  overridePublisher: yes
  
  # Recording (disabled)
  record: no

###############################################
# Paths
# Camera streams published to /camera/{did}/{channel}
# RTSP: rtsp://localhost:8554/camera/123456789/0
# WebRTC: http://localhost:8889/camera/123456789/0/whep
# HLS: http://localhost:8888/camera/123456789/0/index.m3u8

paths:
  ~^camera/(.+)/(\d+)$:
    source: publisher
    overridePublisher: yes
