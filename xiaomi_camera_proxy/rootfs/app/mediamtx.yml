# MediaMTX configuration for Xiaomi Camera Proxy
# This RTSP server receives H.264 streams from cameras via FFmpeg publisher

###############################################
# Global settings

logLevel: info
logDestinations: [stdout]

# Timeouts
readTimeout: 10s
writeTimeout: 10s

###############################################
# RTSP server

rtsp: yes
protocols: [tcp]
rtspAddress: :8554

###############################################
# WebRTC (disabled)

webrtc: no

###############################################
# HLS (disabled)

hls: no

###############################################
# API

api: yes
apiAddress: :9997

###############################################
# Path defaults

pathDefaults:
  # Source is FFmpeg publisher (not on-demand pull)
  source: publisher
  
  # Allow publisher to reconnect/overwrite
  overridePublisher: yes
  
  # Recording (disabled)
  record: no

###############################################
# Paths
# Camera streams published to /camera/{did}/{channel}
# Example: rtsp://localhost:8554/camera/123456789/0

paths:
  ~^camera/(.+)/(\d+)$:
    source: publisher
    overridePublisher: yes
