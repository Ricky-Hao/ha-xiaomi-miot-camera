# MediaMTX configuration for Xiaomi Camera Proxy
# Direct WebRTC streaming (WHEP) - no HA go2rtc needed

###############################################
# Global settings

logLevel: info
logDestinations: [stdout]

# Timeouts - increased for unstable camera connections
readTimeout: 60s
writeTimeout: 60s
writeQueueSize: 1024

###############################################
# RTSP server (internal - receives from FFmpeg)

rtsp: yes
protocols: [tcp]
rtspAddress: :8554

###############################################
# WebRTC - ENABLED for direct browser streaming

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigin: '*'
webrtcICEServers2:
  - url: stun:gd.rickyhao.com:3478

###############################################
# HLS - DISABLED

hls: no

###############################################
# API - enabled for stream status checks

api: yes
apiAddress: :9997

###############################################
# Path defaults

pathDefaults:
  # Source is FFmpeg publisher
  source: publisher
  
  # Allow publisher to reconnect/overwrite
  overridePublisher: yes
  
  # Recording (disabled)
  record: no

###############################################
# Paths
# Camera streams published to /camera/{did}/{channel}
# RTSP: rtsp://localhost:8554/camera/{did}/{channel}
# WebRTC (WHEP): http://localhost:8889/camera/{did}/{channel}/whep

paths:
  ~^camera/(.+)/(\d+)$:
    source: publisher
    overridePublisher: yes
