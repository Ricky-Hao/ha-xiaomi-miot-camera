# MediaMTX configuration for Xiaomi Camera Proxy
# This RTSP server receives H.264/H.265 streams from cameras via FFmpeg publisher

###############################################
# Global settings

logLevel: info
logDestinations: [stdout]

# Timeouts
readTimeout: 10s
writeTimeout: 10s

###############################################
# RTSP server

rtsp: yes
protocols: [tcp]
rtspAddress: :8554

###############################################
# WebRTC server - Low latency streaming

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: '*'
# Use Google's public STUN servers for NAT traversal
webrtcICEServers2:
  - urls:
    - stun:stun.l.google.com:19302
    - stun:stun1.l.google.com:19302

###############################################
# HLS (disabled - using WebRTC instead)

hls: no

###############################################
# API

api: yes
apiAddress: :9997

###############################################
# Path defaults

pathDefaults:
  # Source is FFmpeg publisher (not on-demand pull)
  source: publisher
  
  # Allow publisher to reconnect/overwrite
  overridePublisher: yes
  
  # Recording (disabled)
  record: no

###############################################
# Paths
# Camera streams published to /camera/{did}/{channel}
# RTSP: rtsp://localhost:8554/camera/123456789/0
# WebRTC: http://localhost:8889/camera/123456789/0/whep

paths:
  ~^camera/(.+)/(\d+)$:
    source: publisher
    overridePublisher: yes
